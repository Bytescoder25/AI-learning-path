[project]
name = "rag-service"
version = "0.1.0"
description = "RAG-as-a-Service backend — FastAPI + pgvector (Project 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",   # JWT auth
    "httpx>=0.27",                       # provider API calls
    "tenacity>=9.0",                     # retries/backoff
    "structlog>=24.4",                   # structured logging
    "python-multipart>=0.0.12",          # file uploads
    # --- LLM/embeddings providers (enable the one you pick) ---
    "openai>=1.54",                      # chat + text-embedding-3
    "anthropic>=0.39",                   # Claude chat
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_service"]
